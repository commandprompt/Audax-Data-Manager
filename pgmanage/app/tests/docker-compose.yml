# Requires the sample-database fixtures fetched by ./fetch-test-data.sh (not
# committed to git due to their size) before running `docker compose up`.
services:

  postgres_test_db:
    image: postgres:15.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dellstore
    ports:
      - 5433:5432
    volumes:
      - ./dellstore2-normal-1.0.sql:/docker-entrypoint-initdb.d/db.sql
      - ./test-db.sh:/docker-entrypoint-initdb.d/initdb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dellstore"]
      interval: 2s
      timeout: 3s
      retries: 15

  mysql_test_db:
    image: mysql:8.4.11
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_ROOT_HOST: "%"
    ports:
      - 3307:3306
    volumes:
      - ./mysqlsampledatabase.sql:/docker-entrypoint-initdb.d/db.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 2s
      timeout: 3s
      retries: 30

  mariadb_test_db:
    image: mariadb:11.8.9
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
    ports:
      - 3308:3306
    volumes:
      - ./mysqlsampledatabase.sql:/docker-entrypoint-initdb.d/db.sql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 30

  oracle_test_db:
    image: container-registry.oracle.com/database/free:latest
    environment:
      ORACLE_PWD: oracle
    ports:
      - 1522:1521
    volumes:
      - ./hr:/tmp/hr:ro
      - ./init-oracle.sh:/opt/oracle/scripts/startup/init-oracle.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "echo \"select 'PGM_READY' from all_objects where owner='HR' and rownum=1;\" | sqlplus -s system/$$ORACLE_PWD@localhost:1521/FREEPDB1 | grep -q PGM_READY"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 120s

  mssql_test_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Audax_2026!"
      MSSQL_PID: Developer
    ports:
      - 1434:1433
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  # The mssql/server image has no equivalent of postgres's /docker-entrypoint-initdb.d,
  # so a one-shot sidecar loads the Northwind fixture once the server is healthy.
  mssql_test_db_init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql_test_db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "Audax_2026!"
    volumes:
      - ./instnwnd.sql:/tmp/instnwnd.sql:ro
      - ./init-mssql.sh:/tmp/init-mssql.sh:ro
    entrypoint: ["/bin/bash", "/tmp/init-mssql.sh"]
