<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Audax Data Manager</title>
    <style type="text/css">
      ::-webkit-scrollbar {
        width: 5px;
        background-color: rgba(116, 125, 141, 0.2);
      }

      ::-webkit-scrollbar-thumb {
        background-color: rgba(116, 125, 141, 0.3);
        border-radius: 5px;
      }

      .hidden {
        display: none;
      }

      html, body {
        display: block;
        margin: 0; padding: 0; border: 0;
        width: 100%; height: 100%;
        font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
        font-weight: 400;
        line-height: 1.5;
        overflow: hidden;
        background-color: #FFFFFF;
      }

      webview {
        display: block;
        margin: 0; padding: 0; border: 0;
        position: absolute;
        top: 30px; left: 0;
        width: 100%; height: calc(100% - 30px);
        visibility: hidden;
      }

      #loading_interface {
        position: absolute;
        color: #16171E;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: linear-gradient(to right, #16171E, #1560AD, rgba(21, 96, 173, 0.5));
      }

      .pgmanage__splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        opacity: 0;

        animation: fadeIn 0.3s linear forwards 0s;
      }

      .pgmanage__splash_wrapper {
        display: flex;
        flex-direction: column;
        width: calc(100% - 20px);
        height: calc(100% - 20px);
        background-color: #FFFFFF;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        border-radius: 6px;
        box-sizing: border-box;
      }

      .splash__header {
        position: relative;
        padding: 16px 0 20px 20px;
      }

      .splash__header::after {
        content : '';
        display: block;
        background: linear-gradient(to right, #90949A, transparent);
        height: 1px;
        width: 0;
        left: 20px;
        position: absolute;
        margin-top: 6px;
        animation: growWidth 0.6s linear forwards 1.9s;
      }

      .splash__header_version {
        font-size: 12px;
        color: #4a6480;
        position: absolute;
        right: 20px;
        bottom: 24px;
        opacity: 0;
        animation: fadeIn 0.6s linear forwards 2.4s;
      }

      .splash__body {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .splash__body_wrapper {
        display: flex;
        flex-direction: column;
        position: relative;
        padding: 0 20px;
        margin-top: 10px;
        background-color: #FFFFFF;
        transition: 0.45s;
        opacity: 0;

        animation: fadeIn 0.6s linear forwards 1.8s;
      }

      .stages {
        font-size: 12px;
        color: #4a6480;
        margin-top: 20px;
      }

      .stages__item {
        opacity: 0;
        transform: translateY(-100%);

        animation: textChangingAnimation 0.25s ease forwards;
      }

      .stages__item_title {
        margin: 0;
      }

      .stages__item_description {
        margin: 0;
        font-size: 12px;
        color: #4a6480;
      }

      .splash__footer {
        margin-top: auto;
      }

      .splash__footer_button {
        display: flex;
        justify-content: center;
        padding: 10px;
        background-color: rgba(116, 125, 141, 0.05);
      }

      .splash__footer_button:hover {
        background-color: rgba(116, 125, 141, 0.1);
        transition: all 0.15s linear;
      }

      .splash__footer_button::before {
        border-style: solid;
        border-width: 2px 2px 0 0;
        content: '';
        display: inline-block;
        width: 0.45em;
        height: 0.45em;
        position: relative;
        transform: rotate(135deg);
        vertical-align: top;
        transition: all 0.15s linear;
        bottom: 2px;
      }

      .splash__output {
        max-height: 0;
        overflow-y: auto;
        opacity: 0;
        transition: opacity 0.15s linear 0.15s;
        padding: 0 20px;
      }

      .splash__output.opened {
        max-height: 120px;
        opacity: 1;
      }

      .splash__output.opened + .splash__footer_button:before {
        transform: rotate(315deg);
      }

      .splash__output_text {
        font-size: 12px;
        color: #4a6480;
        margin: 0;
      }

      .splash__output_text:last-of-type {
        padding-bottom: 10px;
      }

      /* Animated Logo audax styles */
      #wordmark_audax path {
        fill-opacity: 0;
        stroke: #1560ad;
        stroke-width: 0.5px;

        stroke-dasharray: 100;
        stroke-dashoffset: 100;

        animation: svgDrawStrokes 1s linear forwards 0.3s,
          fadeInInfill 0.6s linear forwards 1.3s,
          svgFadeStrokes 0.6s linear forwards 1.3s;
      }

      #wordmark_data path,
      #wordmark_manager path {
        fill-opacity: 0;
        animation: fadeInInfillMuted 0.5s linear forwards 0.3s;
      }

      #wordmark_divider {
        fill-opacity: 0;
        animation: fadeInInfillMuted 0.5s linear forwards 0.3s;
      }
      .loading-dots {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .loading-dots .dot {
        width: 11px;
        height: 11px;
        margin: 0 7px;
        border-radius: 50%;
        background: #f29221;
        animation: dotBounce 1.2s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .loading-dots .dot:nth-child(1) {
        animation-delay: 0s;
      }
      .loading-dots .dot:nth-child(2) {
        animation-delay: 0.12s;
      }
      .loading-dots .dot:nth-child(3) {
        animation-delay: 0.24s;
      }
      .loading-dots .dot:nth-child(4) {
        animation-delay: 0.36s;
      }
      .loading-dots .dot:nth-child(5) {
        animation-delay: 0.48s;
      }

      @keyframes dotBounce {
        0%, 60%, 100% {
          transform: scale(0.75) translateY(0);
          box-shadow: 0 2px 3px rgba(242, 146, 33, 0.25);
        }
        30% {
          transform: scale(1.15) translateY(-9px);
          box-shadow: 0 14px 10px -4px rgba(242, 146, 33, 0.4);
        }
      }

      @keyframes svgDrawStrokes {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes svgFadeStrokes {
        to {
          stroke: transparent;
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes fadeInInfill {
        to {
          fill-opacity: 1;
        }
      }

      @keyframes fadeInInfillMuted {
        to {
          fill-opacity: 0.6;
        }
      }

      @keyframes growInFromTop {
        to {
          height: 400px;
          overflow-y: auto;
        }
      }

      @keyframes growWidth {
        to {
          width: 75%;
        }
      }

      @keyframes textChangingAnimation {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* GUI DRAG EVENT */
      .gui__webkit-drag {
        -webkit-app-region: drag;
      }

      /* GUI TOP BAR */
      .gui__top-bar {
        align-items: center;
        background-color: #EFEFEF;
        display: flex;
        height: 30px;
        justify-content: flex-end;
        width: 100%;
      }
      .gui__top-bar__drag-area {
        cursor: grab;
        flex: 1 1 100%;
        height: 30px;
      }
      .gui__top-bar__btn {
        background-color: rgba(0,0,0,0);
        border: none;
        cursor: pointer;
        display: inline-block;
        font-size: 20px;
        line-height: 20px;
        margin: 2px 0px;
        padding: 5px 8px;
        opacity: 0.75;
        transition: 0.35s;
      }
      .gui__top-bar__btn:hover {
        background-color: rgba(0,0,0,0.25);
        opacity: 1;
      }
    </style>
  </head>

                <div class="dot"></div>

              </div>

              <div id="stages_container" class="stages">
                <div class="stages__item">
                  <h4 id="stages_item_title" class="stages__item_title"></h3>
                  <p id="stages_item_description"class="stages__item_description"></p>

    </div>
  <script>
  try {
    var gui = require('nw.gui');
    let clipboard = gui.Clipboard.get();
    let win = gui.Window.get();
    let django = null;
    let v_loading_data_container = document.getElementById('loading_interface');
    let v_loading_data_content = document.getElementById('loading');
    let v_login_wrap_body = document.getElementById('login');
    let v_webview = document.getElementById('view');

    let stagesContainer = document.getElementById('stages_container');
    let stageTitle = document.getElementById('stages_item_title');
    let stageDescription = document.getElementById('stages_item_description');
    let openMoreButton = document.getElementById('open_more');
    let outputContainer = document.getElementById('output_container');
    openMoreButton.addEventListener('click', function () {
      outputContainer.classList.toggle("opened");
      stagesContainer.classList.toggle("hidden");
      win.resizeTo(win.width, outputContainer.classList.contains("opened") ? 360 : 280);
    });

    var winState;
    var currWinMode;
    var resizeTimeout;
    var isMaximizationEvent = false;
    // extra height added in linux x64 gnome-shell env, use it as workaround
    var deltaHeight = gui.App.manifest.window.frame ? 0 : 'disabled';

    function initWindowState() {
        winState = JSON.parse(localStorage.windowState || 'null');

        if (winState) {
            currWinMode = winState.mode;
            if (currWinMode === 'maximized') {
                win.maximize();
            } else {
                restoreWindowState();
            }
        } else {
            currWinMode = 'normal';
            win.resizeTo(1024, 768);
            dumpWindowState();
        }

        win.show();
    }

    function dumpWindowState() {
        if (!winState) {
            winState = {};
        }

        // we don't want to save minimized state, only maximized or normal
        if (currWinMode === 'maximized') {
            winState.mode = 'maximized';
        } else {
            winState.mode = 'normal';
        }

        // when window is maximized you want to preserve normal
        // window dimensions to restore them later (even between sessions)
        if (currWinMode === 'normal') {
            winState.x = win.x;
            winState.y = win.y;
            winState.width = win.width;
            winState.height = win.height;

            // save delta only of it is not zero
            if (deltaHeight !== 'disabled' && deltaHeight !== 0 && currWinMode !== 'maximized') {
                winState.deltaHeight = deltaHeight;
            }
        }
    }

    function restoreWindowState() {
        // deltaHeight already saved, so just restore it and adjust window height
        if (deltaHeight !== 'disabled' && typeof winState.deltaHeight !== 'undefined') {
            deltaHeight = winState.deltaHeight
            winState.height = winState.height - deltaHeight
        }
        //Make sure that the window is displayed somewhere on a screen that is connected to the PC.
        //Imagine you run the program on a secondary screen connected to a laptop - and then the next time you start the
        //program the screen is not connected...
        gui.Screen.Init();
        var screens = gui.Screen.screens;
        var locationIsOnAScreen = false;
        for (var i = 0; i < screens.length; i++) {
            var screen = screens[i];
            if (winState.x > screen.bounds.x && winState.x < screen.bounds.x + screen.bounds.width) {
                if (winState.y > screen.bounds.y && winState.y < screen.bounds.y + screen.bounds.height) {
                    console.debug("Location of window (" + winState.x + "," + winState.y + ") is on screen " + JSON.stringify(screen));
                    locationIsOnAScreen = true;
                }
            }
        }

        if (!locationIsOnAScreen) {
            win.setPosition("center");
        }
        else {
            win.resizeTo(winState.width, winState.height);
            win.moveTo(winState.x, winState.y);
        }
    }

    function saveWindowState() {
        dumpWindowState();
        localStorage['windowState'] = JSON.stringify(winState);
    }

    function finalizeClose() {
      try {
        saveWindowState();
      } catch (err) {
        console.log("winstateError: " + err);
      }

      if (django != null) {
        try {
          process.kill(django.pid);
        } catch (e) {}
      }

      nw.App.quit();
    }

    // handle newwindow messages from the webview
    // allows for opening of webapp links in the default system browser
    v_webview.addEventListener('newwindow', async (e) => {
      const protocol = (new URL(e.targetUrl)).protocol
      if (protocol === 'http:' || protocol === 'https:') {
        await gui.Shell.openExternal(e.targetUrl)
      }
    })


    // allow csv/xls download during data export
    // https://developer.chrome.com/docs/extensions/reference/webviewTag/#event-permissionrequest
    v_webview.addEventListener('permissionrequest', function(e) {
      if (e.permission === 'download') {
        e.request.allow();
      }
    });

    v_webview.addEventListener('loadstop', () => {
      // quit this part if it is not initial loading screen and v_loading_data_container style display is 'none'
      if (!!v_loading_data_container.getAttribute("style")) return;

      // Prevent intermediate frames from being displayed.
      win.hide();

      v_loading_data_container.style.display = 'none';
      document.getElementById('bar_top').style.display = '';
      v_webview.style.visibility = 'visible';

      win.setMinimumSize(1024, 768);
      initWindowState();

      v_webview.contentWindow.postMessage(
        { type: "pgmanage:desktop-host-ready" },
        "*"
      );
    });

    const child_process = require('child_process')
    const path = require('path')
    const url = require('url')

    // Prepare loading interface
    const splashWidth = 600;
    const splashHeight = 280;
    win.resizeTo(splashWidth, splashHeight);

    win.x = Math.floor((window.screen.availWidth/2) - (splashWidth/2));
    win.y = Math.floor((window.screen.availHeight/2) - (splashHeight/2));
    win.show()
    v_loading_data_container.style.display = '';

    win.on('maximize', function () {
        isMaximizationEvent = true;
        currWinMode = 'maximized';
    });

    win.on('unmaximize', function () {
        currWinMode = 'normal';
        restoreWindowState();
    });

    win.on('minimize', function () {
        currWinMode = 'minimized';
    });

    win.on('restore', function () {
        currWinMode = 'normal';
    });

    win.on('close', function () {
      v_webview.contentWindow.postMessage(
        { type: "pgmanage:request-close" },
        "*" 
      );
    });


    window.addEventListener("message", (event) => {
      const data = event.data;

      if (data.type === "pgmanage:read-clipboard-text") {

        if (!data.requestId) {
          return;
        }

        let text = "";

        try {
          text = clipboard.get("text") || "";
        } catch (error) {
          text = "";
        }

        v_webview.contentWindow.postMessage(
          {
            type: "pgmanage:clipboard-text",
            requestId: data.requestId,
            text,
          },
          "*" 
        );

        return;
      }

      if (data.type == "pgmanage:confirm-close") {
        finalizeClose();
      }
    });

    win.on('closed', function() {
      if (django!=null) {
          process.kill(django.pid)
      }
    })

    process.on('exit', () => {
      try{
        process.kill(django.pid)
      }
      catch (e) {}
      nw.App.quit();
    })

    if (process.platform === 'darwin') {
      process.env.PATH=path.join('/usr/local/bin', path.delimiter, process.env.PATH)
    }

    django = child_process.spawn(path.join(global.__dirname,'audaxdm-server/audaxdm-server'),['-A'], { detached: false });

    django.stderr.on('data', (data) => {
      outputContainer.innerHTML += `<p class="splash__output_text">${data}</p>`
    });

    django.stdout.on('data', (data) => {
      lines = data.toString().split('\n');

      lines.forEach((line) => {
        if(line == '')
          return

        if (line.substring(0, 4) != 'http') {
          let out =`<p class="splash__output_text">${line}</p>`
          outputContainer.innerHTML += out
            document.getElementById('stages_item_description').innerHTML = ''
          if(line.startsWith(' ')) {
            document.getElementById('stages_item_description').innerHTML = line
          } else {
            document.getElementById('stages_item_title').innerHTML = line
          }
        } else {
            document.getElementById('stages_item_description').innerHTML = '';
            document.getElementById('stages_item_title').innerHTML = 'Opening Audax Data Manager...';

            v_webview.src = line;
        }
      })
    });


    // GUI controls
    function guiMinimize() {
      win.minimize();
    }
    function guiToggleFullscreen() {
      var v_is_maximized = (screen.availWidth - window.innerWidth === 0);
      if (v_is_maximized) {
        win.restore();
      }
      else {
        win.maximize();
      }
    }
    function guiClose() {
      win.close();
    }

  }
  catch(e) {
    document.write(e);
  }
  </script>
